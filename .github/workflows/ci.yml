name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-engine:
    # The native app (android-native/) on pull requests into main: engine unit tests, app compiles.
    runs-on: ubuntu-latest
    # It runs the pull request's Gradle build: a read-only token, not kept in the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes "tools", which sdkmanager no longer has (the job failed there).
          packages: platform-tools
      # The NDK and CMake the engine module pins, read from its build file so they can't drift.
      - name: Install NDK and CMake
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' android-native/engine/build.gradle.kts)
          cmake=$(sed -n 's/.*version = "\([0-9.]*\)".*/\1/p' android-native/engine/build.gradle.kts | head -1)
          echo "NDK $ndk, CMake $cmake"
          sdkmanager "ndk;$ndk" "cmake;$cmake"
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine unit tests
        working-directory: android-native
        run: ./gradlew :engine:testDebugUnitTest
      # The app has no unit tests; compiling its Kotlin catches app changes that no longer build.
      - name: Compile the app
        working-directory: android-native
        run: ./gradlew :app:compileDebugKotlin
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: android-native/engine/build/reports/tests/
